name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate stable semantic version tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate stable semantic version tag
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/validate-release-tag.sh "$TAG"

  test:
    name: Test release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Test release tag validation
        run: bash scripts/test-validate-release-tag.sh

      - name: Test
        run: make test

      - name: Vet
        run: make vet

  release:
    name: Publish stable release
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.8.2

      - name: Build and publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
