name: CI

on:
  pull_request:
  push:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Check Go formatting
        run: test -z "$(find cmd internal -name '*.go' -type f -print0 | xargs -0 gofmt -l)"

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Vet
        run: make vet
