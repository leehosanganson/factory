services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-test-data:/var/lib/postgresql

volumes:
  postgres-test-data:
